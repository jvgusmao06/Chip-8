name: Build and Release CHIP-8

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libsdl3-dev || true

      - name: Build with CMake or GCC
        run: |
          mkdir -p exe
          if command -v pkg-config >/dev/null && pkg-config --exists sdl3; then
            gcc -Wall -Wextra -O2 src/main.c src/chip8.c -Iinclude $(pkg-config --cflags --libs sdl3) -o exe/chip8
          else
            echo "Building with standard -lSDL3 flag..."
            gcc -Wall -Wextra -O2 src/main.c src/chip8.c -Iinclude -lSDL3 -o exe/chip8 || true
          fi

      - name: Upload Linux Artifact
        if: hashFiles('exe/chip8') != ''
        uses: actions/upload-artifact@v4
        with:
          name: chip8-linux
          path: exe/chip8

  release:
    name: Create GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: chip8-linux
          path: exe/
        continue-on-error: true

      - name: Prepare Release Assets
        run: |
          ls -la exe/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            exe/chip8.exe
            exe/chip8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
